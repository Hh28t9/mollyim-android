name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - fix-770

env:
  # Ép JVM và Kotlin Daemon chỉ được dùng tối đa 3GB RAM mỗi tiến trình
  GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx3g -XX:+UseG1GC' -Dkotlin.daemon.jvmargs='-Xmx3g'"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # BẮT BUỘC: Giới hạn --max-workers=1 để ngăn đa luồng gây tràn RAM
      - name: Build Debug APK
        run: ./gradlew assembleProdWebsiteDebug -x lint -x test --no-daemon --max-workers=1

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: molly-fix-770-apk
          path: app/build/outputs/apk/**/*.apk
          

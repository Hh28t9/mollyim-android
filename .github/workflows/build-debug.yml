name: Build FCM-WebRTC Variant (ProdWebsite)

on:
  workflow_dispatch:
  push:
    branches:
      - fix-770

env:
  # Cấp phát 4.5GB RAM và ép biên dịch Kotlin nội tiến trình (in-process)
  GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx4500m -XX:+UseG1GC' -Dkotlin.compiler.execution.strategy=in-process"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Chỉ biên dịch đích danh ProdWebsiteDebug, vô hiệu hóa đa luồng và bỏ qua kiểm thử
      - name: Build ProdWebsiteDebug APK
        run: ./gradlew assembleProdWebsiteDebug -x lint -x test --no-daemon --max-workers=1

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: molly-fix-770-fcm-webrtc
          path: app/build/outputs/apk/**/*.apk
          
